<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A1B9A"/>
      <stop offset="50%" stop-color="#C2185B"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Yggdrasil - Norse Tree of Life -->
  <g transform="translate(16,16)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trunk -->
    <line x1="0" y1="-9" x2="0" y2="10"/>
    <!-- Upper branches - left -->
    <path d="M0,-6 Q-4,-8 -7,-5"/>
    <path d="M0,-3 Q-5,-5 -8,-2"/>
    <!-- Upper branches - right -->
    <path d="M0,-6 Q4,-8 7,-5"/>
    <path d="M0,-3 Q5,-5 8,-2"/>
    <!-- Top crown -->
    <path d="M0,-9 Q-3,-11 -5,-9"/>
    <path d="M0,-9 Q3,-11 5,-9"/>
    <!-- Roots - left -->
    <path d="M0,6 Q-4,8 -7,6"/>
    <path d="M0,8 Q-5,10 -8,8"/>
    <!-- Roots - right -->
    <path d="M0,6 Q4,8 7,6"/>
    <path d="M0,8 Q5,10 8,8"/>
    <!-- Center circle (world node) -->
    <circle cx="0" cy="0" r="2" fill="#fff" stroke="none"/>
  </g>
</svg>